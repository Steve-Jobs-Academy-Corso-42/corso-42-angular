<app-navbar></app-navbar>

<main id="home" class="catalogue">
  <h1>Catalogo</h1>

  <h2>Totale: {{ contatoreTotale }}</h2>

  <section id="contatori" aria-labelledby="counters-heading">
    <h2 id="counters-heading">Contatori</h2>
    <!-- Ogni istanza del componente mantiene il proprio valore. -->
    <div class="counters">
      <app-counter
        (segnalaCambiamento)="contatoreTotale += $event"
      ></app-counter>
      <app-counter
        (segnalaCambiamento)="contatoreTotale += $event"
      ></app-counter>
      <app-counter
        (segnalaCambiamento)="contatoreTotale += $event"
      ></app-counter>
    </div>
  </section>

  <section id="prodotti" aria-labelledby="products-heading">
    <h2 id="products-heading">Prodotti</h2>
    <!-- Lo stesso componente può essere riutilizzato più volte nella pagina. -->
    <div class="product-cards">
      <app-product-card
        title="Prodotto 1"
        description="Descrizione del prodotto 1"
        [price]="1999"
      ></app-product-card>
      <app-product-card
        title="Prodotto 2"
        description="Descrizione del prodotto 2"
        [price]="3999"
      ></app-product-card>
      <app-product-card
        title="Prodotto 3"
        description="Descrizione del prodotto 3"
        [price]="4999"
      ></app-product-card>
      <app-product-card
        title="Prodotto 4"
        description="Descrizione del prodotto 4"
        [price]="5999"
      ></app-product-card>
      <app-product-card
        title="Prodotto 5"
        description="Descrizione del prodotto 5"
        [price]="6999"
      ></app-product-card>
    </div>
  </section>
</main>
